apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: event
  namespace: observability
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.145.0
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi
  serviceAccount: event-collector
  env:
    - name: K8S_NODE_NAME
      valueFrom:
