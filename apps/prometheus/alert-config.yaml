apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-main
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      receiver: "slack-critical"
      routes:
        - match:
            severity: critical
          receiver: "slack-critical"
        - match:
            severity: warning
          receiver: "slack-warning"
        - match:
            severity: info
          receiver: "slack-info"

    receivers:
      - name: "slack-critical"
        slack_configs:
          - send_resolved: true
            api_url: "https://hooks.slack.com/services/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"
            channel: "#alerts"
            title: ":rotating_light: CRITICAL ALERT"
            text: |
              *Alert:* {{ .CommonLabels.alertname }}
              *Severity:* {{ .CommonLabels.severity }}
              *Namespace:* {{ .CommonLabels.namespace }}
              {{ if .CommonLabels.pod }}*Pod:* {{ .CommonLabels.pod }}{{ end }}
              *Description:* {{ range .Alerts }}{{ if .Annotations.description }}{{ .Annotations.description }}{{ else if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}No description{{ end }}{{ end }}
              *Start:* {{ range .Alerts }}{{ .StartsAt }}{{ end }}

      - name: "slack-warning"
        slack_configs:
          - send_resolved: true
            api_url: "https://hooks.slack.com/services/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"
            channel: "#alerts"
            title: ":warning: Warning Alert"
            text: |
              *Alert:* {{ .CommonLabels.alertname }}
              *Severity:* {{ .CommonLabels.severity }}
              *Namespace:* {{ .CommonLabels.namespace }}
              {{ if .CommonLabels.pod }}*Pod:* {{ .CommonLabels.pod }}{{ end }}
              *Description:* {{ range .Alerts }}{{ if .Annotations.description }}{{ .Annotations.description }}{{ else if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}No description{{ end }}{{ end }}
              *Start:* {{ range .Alerts }}{{ .StartsAt }}{{ end }}

      - name: "slack-info"
        slack_configs:
          - send_resolved: true
            api_url: "https://hooks.slack.com/services/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"
            channel: "#alerts"
            title: ":information_source: Info Alert"
            text: |
              *Alert:* {{ .CommonLabels.alertname }}
              *Severity:* {{ .CommonLabels.severity }}
              *Namespace:* {{ .CommonLabels.namespace }}
              {{ if .CommonLabels.pod }}*Pod:* {{ .CommonLabels.pod }}{{ end }}
              *Description:* {{ range .Alerts }}{{ if .Annotations.description }}{{ .Annotations.description }}{{ else if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}No description{{ end }}{{ end }}

    templates:
      - '/etc/alertmanager/config/*.tmpl'
