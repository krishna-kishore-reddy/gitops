alertmanager:
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: 'https://hooks.slack.com/services/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'

    inhibit_rules:
      - equal: [namespace, alertname]
        source_matchers: [severity = critical]
        target_matchers: [severity =~ warning|info]
      - equal: [namespace, alertname]
        source_matchers: [severity = warning]
        target_matchers: [severity = info]
      - equal: [namespace]
        source_matchers: [alertname = InfoInhibitor]
        target_matchers: [severity = info]
      - target_matchers: [alertname = InfoInhibitor]

    receivers:
      - name: 'slack-critical'
        slack_configs:
          - channel: '#alerts'
            send_resolved: true
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            title: '{{ .CommonLabels.alertname }}'
            text: |-
              {{ if eq .Status "firing" }}
              🚨 *CRITICAL ALERT FIRED* 🚨
              {{ else }}
              ✅ *ALERT RESOLVED*
              {{ end }}

              *Alert:* `{{ .CommonLabels.alertname }}`
              *Severity:* `{{ .CommonLabels.severity }}`
              *Namespace:* `{{ if .CommonLabels.namespace }}{{ .CommonLabels.namespace }}{{ else }}N/A{{ end }}`
              {{ if .CommonLabels.pod }}*Pod:* `{{ .CommonLabels.pod }}`{{ end }}
              {{ if .CommonLabels.container }}*Container:* `{{ .CommonLabels.container }}`{{ end }}
              {{ if .CommonLabels.node }}*Node:* `{{ .CommonLabels.node }}`{{ end }}
              {{ if .CommonLabels.instance }}*Instance:* `{{ .CommonLabels.instance }}`{{ end }}

              {{ if .CommonAnnotations.summary }}
              *Summary:* {{ .CommonAnnotations.summary }}
              {{ end }}
              {{ if .CommonAnnotations.description }}
              *Description:* {{ .CommonAnnotations.description }}
              {{ end }}

              {{ range .Alerts }}
              *Starts At:* {{ .StartsAt }}
              {{ if .EndsAt }}*Ends At:* {{ .EndsAt }}{{ end }}
              {{ end }}

              <http://alertmanager.inarm.in/#/alerts|View in Alertmanager> │ <http://prometheus.inarm.in|Prometheus> │ <http://grafana.inarm.in|Grafana>

              {{ if eq .Status "firing" }}
              ⚡ *Action Required:* Investigate immediately!
              {{ else }}
              ✅ *Resolved:* No further action needed.
              {{ end }}

      - name: 'slack-warning'
        slack_configs:
          - channel: '#alerts'
            send_resolved: true
            color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
            title: '{{ .CommonLabels.alertname }}'
            text: |-
              {{ if eq .Status "firing" }}
              ⚠️ *WARNING ALERT FIRED* ⚠️
              {{ else }}
              ✅ *ALERT RESOLVED*
              {{ end }}

              *Alert:* `{{ .CommonLabels.alertname }}`
              *Severity:* `{{ .CommonLabels.severity }}`
              *Namespace:* `{{ if .CommonLabels.namespace }}{{ .CommonLabels.namespace }}{{ else }}N/A{{ end }}`
              {{ if .CommonLabels.pod }}*Pod:* `{{ .CommonLabels.pod }}`{{ end }}
              {{ if .CommonLabels.container }}*Container:* `{{ .CommonLabels.container }}`{{ end }}
              {{ if .CommonLabels.node }}*Node:* `{{ .CommonLabels.node }}`{{ end }}
              {{ if .CommonLabels.instance }}*Instance:* `{{ .CommonLabels.instance }}`{{ end }}

              {{ if .CommonAnnotations.summary }}
              *Summary:* {{ .CommonAnnotations.summary }}
              {{ end }}
              {{ if .CommonAnnotations.description }}
              *Description:* {{ .CommonAnnotations.description }}
              {{ end }}

              {{ range .Alerts }}
              *Starts At:* {{ .StartsAt }}
              {{ if .EndsAt }}*Ends At:* {{ .EndsAt }}{{ end }}
              {{ end }}

              <http://alertmanager.inarm.in/#/alerts|View in Alertmanager> │ <http://prometheus.inarm.in|Prometheus> │ <http://grafana.inarm.in|Grafana>

      - name: 'slack-info'
        slack_configs:
          - channel: '#alerts'
            send_resolved: true
            color: '{{ if eq .Status "firing" }}#439FE0{{ else }}good{{ end }}'
            title: '{{ .CommonLabels.alertname }}'
            text: |-
              {{ if eq .Status "firing" }}
              ℹ️ *INFO ALERT FIRED*
              {{ else }}
              ✅ *ALERT RESOLVED*
              {{ end }}

              *Alert:* `{{ .CommonLabels.alertname }}`
              *Severity:* `{{ .CommonLabels.severity }}`
              *Namespace:* `{{ if .CommonLabels.namespace }}{{ .CommonLabels.namespace }}{{ else }}N/A{{ end }}`

              {{ if .CommonAnnotations.summary }}
              *Summary:* {{ .CommonAnnotations.summary }}
              {{ end }}
              {{ if .CommonAnnotations.description }}
              *Description:* {{ .CommonAnnotations.description }}
              {{ end }}

              {{ range .Alerts }}
              *Starts At:* {{ .StartsAt }}
              {{ if .EndsAt }}*Ends At:* {{ .EndsAt }}{{ end }}
              {{ end }}

              <http://alertmanager.inarm.in/#/alerts|View Details>

    route:
      group_by: [alertname, cluster, namespace, pod]
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'slack-warning'
      routes:
        - matchers:
            - severity = critical
          receiver: 'slack-critical'

        - matchers:
            - severity = warning
          receiver: 'slack-warning'

        - matchers:
            - severity = info
          receiver: 'slack-info'

        - matchers:
            - alertname = Watchdog
          receiver: 'slack-info'
          repeat_interval: 24h

