alertmanager:
  config:
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      receiver: "slack-notifications"
      routes:
        - match:
            severity: critical
          receiver: "slack-critical"
        - match:
            severity: warning
          receiver: "slack-warning"
        - match:
            severity: info
          receiver: "slack-info"

    receivers:
      - name: "slack-critical"
        slack_configs:
          - send_resolved: true
            api_url:
              name: alertmanager-slack-webhook
              key: slack_api_url
            channel: "#alerts"
            title: ":rotating_light: *[CRITICAL]* {{ .CommonLabels.alertname }}"
            text: |-
              {
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": ":rotating_light: CRITICAL ALERT"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Alert:* {{ .CommonLabels.alertname }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Severity:* {{ .CommonLabels.severity }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Namespace:* {{ .CommonLabels.namespace }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Pod:* {{ .CommonLabels.pod }}"
                      }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Description:* {{ .Annotations.description | default .Annotations.summary }}"
                    }
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "*Start:* {{ .StartsAt }} | *Ends:* {{ .EndsAt }}"
                      }
                    ]
                  }
                ]
              }

      - name: "slack-warning"
        slack_configs:
          - send_resolved: true
            api_url:
              name: alertmanager-slack-webhook
              key: slack_api_url
            channel: "#alerts"
            title: ":warning: *[WARNING]* {{ .CommonLabels.alertname }}"
            text: |-
              {
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": ":warning: Warning Alert"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Alert:* {{ .CommonLabels.alertname }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Severity:* {{ .CommonLabels.severity }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Namespace:* {{ .CommonLabels.namespace }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Pod:* {{ .CommonLabels.pod }}"
                      }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Description:* {{ .Annotations.description | default .Annotations.summary }}"
                    }
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "*Start:* {{ .StartsAt }} | *Ends:* {{ .EndsAt }}"
                      }
                    ]
                  }
                ]
              }

      - name: "slack-info"
        slack_configs:
          - send_resolved: true
            api_url:
              name: alertmanager-slack-webhook
              key: slack_api_url
            channel: "#alerts"
            title: ":information_source: *[INFO]* {{ .CommonLabels.alertname }}"
            text: |-
              {
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": ":information_source: Info Alert"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Alert:* {{ .CommonLabels.alertname }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Severity:* {{ .CommonLabels.severity }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Namespace:* {{ .CommonLabels.namespace }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Pod:* {{ .CommonLabels.pod }}"
                      }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Description:* {{ .Annotations.description | default .Annotations.summary }}"
                    }
                  }
                ]
              }

    templates:
      - '/etc/alertmanager/config/*.tmpl'
